<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Business SetuIND Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      font-size: 18px;
    }
    h1 { font-size: 2em; }
    h2 { font-size: 1.5em; }
    label {
      font-size: 1.1em;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      margin-bottom: 15px;
      font-size: 1.1em;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 14px;
      font-size: 1.2em;
      background-color: #1d3557;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #message {
      font-size: 1.1em;
      font-weight: bold;
      color: green;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <h1>
    <span style="color: #e63946; font-size: 1.3em;">Business</span>
    <span style="color: #1d3557;">SetuIND</span>
    Registration
  </h1>

  <hr>

  <h2>Registration Form</h2>

  <form id="regForm">
    <label>Naam:</label>
    <input type="text" id="naam" placeholder="Apna naam likhein">

    <label>Email:</label>
    <input type="email" id="email" placeholder="Apna email likhein">

    <label>Phone Number:</label>
    <input type="tel" id="phone" placeholder="Apna number likhein">

    <label>Date of Birth:</label>
    <input type="date" id="dob">

    <label>Study (Qualification):</label>
    <input type="text" id="study" placeholder="Jaise: 12th, B.Tech, etc.">

    <label>Skills:</label>
    <input type="text" id="skills" placeholder="Jaise: Coding, Design, etc.">

    <button type="submit">Register Karein</button>
  </form>

  <p id="message"></p>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAbLxLpAdGXx8ZvkdJlfVGPV3lT62t3qR0",
      authDomain: "mera-registration.firebaseapp.com",
      projectId: "mera-registration",
      storageBucket: "mera-registration.firebasestorage.app",
      messagingSenderId: "36065909120",
      appId: "1:36065909120:web:b28429da32b0922e8e8965"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    emailjs.init("-M-ZM-DIiqz5GkntR");

    document.getElementById("regForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const naam = document.getElementById("naam").value;
      const email = document.getElementById("email").value;
      const phone = document.getElementById("phone").value;
      const dob = document.getElementById("dob").value;
      const study = document.getElementById("study").value;
      const skills = document.getElementById("skills").value;

      const counterRef = db.collection("counters").doc("registrationCounter");

      db.runTransaction(function(transaction) {
        return transaction.get(counterRef).then(function(doc) {
          let newCount;
          if (!doc.exists) {
            newCount = 1;
            transaction.set(counterRef, { count: 1 });
          } else {
            newCount = doc.data().count + 1;
            transaction.update(counterRef, { count: newCount });
          }

          const regId = "REG-" + String(newCount).padStart(4, "0");

          const newRegRef = db.collection("registrations").doc();
          transaction.set(newRegRef, {
            registrationId: regId,
            naam: naam,
            email: email,
            phone: phone,
            dob: dob,
            study: study,
            skills: skills,
            time: new Date()
          });

          return regId;
        });
      }).then(function(regId) {
        document.getElementById("message").innerText = "Registration ho gaya! Aapki ID hai: " + regId;

        emailjs.send("service_ul4e8ki", "template_mk9jp71", {
          to_name: naam,
          to_email: email,
          reg_id: regId
        }).then(function() {
          console.log("User email bhej diya gaya");
        }).catch(function(error) {
          console.log("User email error: " + error.text);
        });

        emailjs.send("service_ul4e8ki", "template_mk9jp71", {
          to_name: "Admin",
          to_email: "prabhatgangwar017@gmail.com",
          reg_id: regId + " (Naya registration: " + naam + ", " + phone + ")"
        }).then(function() {
          console.log("Admin email bhej diya gaya");
        }).catch(function(error) {
          console.log("Admin email error: " + error.text);
        });

        document.getElementById("regForm").reset();
      }).catch(function(error) {
        document.getElementById("message").innerText = "Error: " + error.message;
      });
    });
  </script>
</body>
      </html>
